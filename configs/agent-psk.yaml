# Agent-side proxy: PSK-secured DTLS tunnel listener.
role: agent

tunnel:
  mode: dtls
  listen_addr: ":10162"
  psk_identity: "snmp-shield-agent"
  # The PSK must match the manager side; this identity label may differ.
  psk: "text:change-me-shared-secret"
  # Optional DTLS 1.2 PSK ciphersuites, most preferred first; both sides
  # must share at least one. Supported: aes128-ccm-8 (default),
  # aes256-ccm-8, aes128-ccm, aes128-gcm, aes128-cbc.
  # psk_ciphersuites: ["aes256-ccm-8", "aes128-ccm-8"]
  keepalive_secs: 15
  max_frame_size: 8192

agent:
  # Clear SNMP leg: the real SNMP agent behind this proxy.
  agent_addr: "127.0.0.1:161"
  # Optional: local devices send traps here; relayed over the tunnel.
  trap_listen_addr: ":10163"

# Optional notification filtering at the relay ingress: notifications
# whose trap OID does not pass the filter are dropped before they are
# relayed over the tunnel. action: "allow" (forward only matching OIDs)
# or "deny" (drop matching OIDs); matching is prefix-based on arc
# boundaries.
# notifications:
#   filter:
#     action: deny
#     oids:
#       - "1.3.6.1.4.1.99"  # drop this enterprise's traps

# Optional SNMP metrics interface: a small read-only SNMPv2c health agent
# (GET/GETNEXT: identity, tunnel state, counters) and v2c event traps for
# tunnel lifecycle changes (up/down, HA failover). Lets an SNMP-native
# monitoring system watch the proxy without the Prometheus endpoint
# (--metrics-addr stays available alongside).
# metrics:
#   listen_addr: "127.0.0.1:10161"    # health MIB (GET/GETNEXT)
#   trap_sink_addr: "127.0.0.1:10164" # v2c event traps
#   community: "public"
#   # base_oid: ".1.3.6.1.4.1.58427.1" # enterprise OID (default)

# Optional write policy for requests arriving over the tunnel. This box
# sits next to the device, so read_only / write_policy here protect the
# device itself, independent of the manager-side proxy. A refused SET is
# answered with notWritable (v1: noSuchName) so the manager does not
# retransmit into a timeout.
# access.allow / access.rate_per_sec do NOT apply on the agent role:
# requests arrive over the trusted tunnel and carry no client address
# (the proxy warns at startup if they are set) — configure those on the
# manager-side proxy. A passthrough tunnel is opaque, so the write policy
# cannot inspect it either; use usm-translate or tsm.
# A SIGHUP reload re-reads ONLY this block in place (systemctl reload);
# every other block needs a restart. See README "Access control".
# access:
#   read_only: true
#   # ...or an OID-scoped policy (deny overrides, allow must cover all):
#   # write_policy:
#   #   default: deny
#   #   rules:
#   #     - {oid: "1.3.6.1.4.1.99.1",   action: allow}
#   #     - {oid: "1.3.6.1.4.1.99.1.9", action: deny}
