# Agent-side proxy, TSM mode: the tunnel (D)TLS handshake authenticates
# the manager-side proxy (RFC 5591). The peer certificate of the tunnel
# carries the securityName; only allow-listed identities are forwarded.
role_note: "run with: snmp-proxy agent --config configs/agent-tsm.yaml"

tunnel:
  mode: dtls
  listen_addr: ":10162"              # tunnel listener the manager dials
  # Certificate material for the agent-side tunnel server. Client certs are
  # verified against this CA (RequireAndVerifyClientCert).
  ca_file: "certs/ca.pem"
  cert_file: "certs/agent.pem"
  key_file: "certs/agent-key.pem"
  keepalive_secs: 10
  max_reconnect_backoff_secs: 30
  max_frame_size: 65536

agent:
  # the real SNMP agent (requests are forwarded here as v2c)
  agent_addr: "127.0.0.1:161"
  agent_community: "public"          # community used toward the real agent
  # optional: accept notifications from local devices
  trap_listen_addr: ""
  # optional: where inbound notifications from the tunnel are relayed
  trap_sink_addr: ""
  trap_sink_community: "public"

security:
  mode: tsm
  # allow-list of peer certificate CNs; empty = accept any valid cert
  tsm_identities: ["snmp-proxy-manager"]

# Optional SNMP metrics interface: a small read-only SNMPv2c health agent
# (GET/GETNEXT: identity, tunnel state, counters) and v2c event traps for
# tunnel lifecycle changes (up/down, HA failover). Lets an SNMP-native
# monitoring system watch the proxy without the Prometheus endpoint
# (--metrics-addr stays available alongside).
# metrics:
#   listen_addr: "127.0.0.1:10161"    # health MIB (GET/GETNEXT)
#   trap_sink_addr: "127.0.0.1:10164" # v2c event traps
#   community: "public"
#   # base_oid: ".1.3.6.1.4.1.58427.1" # enterprise OID (default)
