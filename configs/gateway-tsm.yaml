# TSM gateway: single box, no second proxy. Standard TSM clients
# (SNMP-over-DTLS per RFC 6353) connect directly to the gateway; the
# (D)TLS handshake is the SNMP authentication (peer certificate ->
# securityName, checked against security.tsm_identities). Authenticated
# requests are relayed as clear v1/v2c to the legacy agent.
role: gateway

# The legacy (v1/v2c-only) agent behind the gateway.
gateway:
  listen_addr: ":16161"       # raw DTLS front leg (one datagram = one DTLS record)
  agent_addr: "127.0.0.1:161" # legacy agent
  agent_community: "public"   # v2c community toward the legacy agent
  # trap_listen_addr: ":10162" # clear traps from the legacy network (optional)
  # trap_sink_addr: "10.0.0.5:10162" # manager's TSM trap receiver (required with trap_listen_addr)

security:
  mode: tsm-gateway
  # Allow-list of peer certificate identities (leaf CN). Empty = any
  # certificate signed by the CA is accepted.
  tsm_identities:
    - "snmp-proxy-manager"

# Certificate material for the raw DTLS front leg (same keys as the
# tunnel section; the gateway has no tunnel, but reuses the layout):
# the gateway presents cert/key and verifies client certificates
# against the CA. Generate a throwaway PKI with scripts/gen-certs.sh.
tunnel:
  ca_file: "certs/ca.crt"
  cert_file: "certs/server.crt"
  key_file: "certs/server.key"

# Optional notification filtering: notifications whose trap OID does not
# pass the filter are dropped before they are wrapped and delivered.
# action: "allow" (forward only matching OIDs) or "deny" (drop matching
# OIDs); matching is prefix-based on arc boundaries.
# notifications:
#   filter:
#     action: allow
#     oids:
#       - "1.3.6.1.4.1.8072"  # forward only this enterprise's traps

# Optional SNMP metrics interface: a small read-only SNMPv2c health agent
# (GET/GETNEXT: identity, tunnel state, counters) and v2c event traps for
# tunnel lifecycle changes (up/down, HA failover). Lets an SNMP-native
# monitoring system watch the proxy without the Prometheus endpoint
# (--metrics-addr stays available alongside).
# metrics:
#   listen_addr: "127.0.0.1:10161"    # health MIB (GET/GETNEXT)
#   trap_sink_addr: "127.0.0.1:10164" # v2c event traps
#   community: "public"
#   # base_oid: ".1.3.6.1.4.1.58427.1" # enterprise OID (default)
