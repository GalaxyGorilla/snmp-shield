# USM gateway mode with several agents in one process.
#
#   [standard manager] --SNMPv3 USM authPriv--> [gateway] --clear v2c--> [agent A]
#                                                     \--clear v2c--> [agent B]
#
# Each `agents:` entry is an independent listener↔agent pair: its own
# front listener, upstream agent, access policy, security state and
# optional trap legs. No datagram crosses entries. The process still has
# one security mode (usm-gateway here) and one metrics endpoint.
#
# This file is the multi-agent variant of gateway-usm.yaml. The single-
# agent gateway.listen_addr/gateway.agent_addr pair must not be used
# together with `agents:`.

role: gateway          # passed via subcommand: snmp-shield gateway --config ...

security:
  mode: usm-gateway
  # Per-agent engine stores are derived as <engine_store_dir>/<name>.json.
  # An explicit security.engine_store in an entry wins.
  engine_store_dir: /var/lib/snmp-shield/engines
  # Process-wide defaults; an entry's `security:` block may override
  # users, engine_id, engine_store, tsm_identities and trap_community.
  users:
    - name: nms
      auth_protocol: sha
      auth_passphrase: "changeme-auth"
      priv_protocol: aes
      priv_passphrase: "changeme-priv"

gateway:
  # Process-wide default for entries that do not set their own.
  trap_sink_community: public

agents:
  - name: plc
    listen_addr: "10.0.0.10:161"        # managers connect here for the PLC
    agent_addr: "10.0.0.50:161"         # legacy PLC (clear v1/v2c)
    agent_community: "public"
    # This agent has its own managers/credentials and its own engine store.
    security:
      users:
        - name: plc-nms
          auth_protocol: sha
          auth_passphrase: "changeme-plc-auth"
          priv_protocol: aes
          priv_passphrase: "changeme-plc-priv"
      engine_store: /var/lib/snmp-shield/engines/plc-explicit.json
    access:
      read_only: true
      allow: ["10.8.0.0/24"]
      rate_per_sec: 50
    # Optional per-entry notification legs (both or neither) and filter.
    trap_listen_addr: "10.0.0.10:162"
    trap_sink_addr: "10.8.0.5:162"
    notifications:
      filter:
        action: allow
        oids: ["1.3.6.1.4.1.8072"]

  - name: ahu
    listen_addr: "10.0.0.11:161"
    agent_addr: "10.0.0.51:161"
    agent_community: "public"
    # No security override: inherits users and derives
    # /var/lib/snmp-shield/engines/ahu.json.
    access:
      allow: ["10.8.0.0/24"]
      write_policy:
        default: deny
        rules:
          - {oid: "1.3.6.1.4.1.99.1", action: allow}

# Optional SNMP metrics interface and notification filter are
# process-wide, exactly as in gateway-usm.yaml.
# metrics:
#   listen_addr: "127.0.0.1:10161"
#   trap_sink_addr: "127.0.0.1:10164"
# notifications:
#   filter:
#     action: allow
#     oids: ["1.3.6.1.4.1.8072"]
