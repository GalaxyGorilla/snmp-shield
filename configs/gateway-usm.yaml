# USM gateway mode: single-box deployment — no tunnel, no second proxy.
#
#   [standard manager] --SNMPv3 USM authPriv (RFC 3414)--> [gateway]
#       --clear v2c--> [legacy agent]
#
# The gateway is the authoritative SNMP engine toward the manager:
# standard v3 managers (net-snmp, Zabbix, PRTG, ...) authenticate with
# security.users below (authPriv). Authenticated requests are relayed as
# clear v1/v2c to the legacy agent; clear v1/v2c arriving on the front
# leg is rejected — unauthenticated traffic never reaches the legacy
# device. 100% standard SNMP on every wire.
role: gateway          # passed via subcommand: snmp-shield gateway --config ...

gateway:
  listen_addr: ":16161"        # SNMPv3 USM listener (managers connect here)
  agent_addr: "127.0.0.1:161"  # legacy SNMP agent (relayed as clear v2c)
  agent_community: "public"    # community toward the legacy agent
  # Optional reverse notification direction: the legacy network fires
  # clear v1/v2c traps at trap_listen_addr; they are wrapped into
  # authenticated v3 USM notifications and delivered to the manager's
  # v3 trap receiver at trap_sink_addr.
  # trap_listen_addr: ":10162"
  # trap_sink_addr: "127.0.0.1:10162"

# Optional notification filtering: notifications whose trap OID does not
# pass the filter are dropped before they are wrapped and delivered.
# action: "allow" (forward only matching OIDs) or "deny" (drop matching
# OIDs); matching is prefix-based on arc boundaries.
# notifications:
#   filter:
#     action: allow
#     oids:
#       - "1.3.6.1.4.1.8072"  # forward only this enterprise's traps

security:
  mode: usm-gateway
  engine_store: /var/lib/snmp-shield/gateway-engine.json  # REQUIRED: boots must never decrease
  # engine_id: "hex:8000b98380736e6d702d70726f7879"       # optional, fixed engine ID
  users:
    - name: nms
      auth_protocol: sha
      auth_passphrase: "changeme-auth"
      priv_protocol: aes
      priv_passphrase: "changeme-priv"

# Optional SNMP metrics interface: a small read-only SNMPv2c health agent
# (GET/GETNEXT: identity, tunnel state, counters) and v2c event traps for
# tunnel lifecycle changes (up/down, HA failover). Lets an SNMP-native
# monitoring system watch the proxy without the Prometheus endpoint
# (--metrics-addr stays available alongside).
# metrics:
#   listen_addr: "127.0.0.1:10161"    # health MIB (GET/GETNEXT)
#   trap_sink_addr: "127.0.0.1:10164" # v2c event traps
#   community: "public"
#   # base_oid: ".1.3.6.1.4.1.58427.1" # enterprise OID (default)
