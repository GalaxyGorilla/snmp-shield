# Manager-side proxy: PSK-secured DTLS tunnel to the agent-side proxy.
role: manager

tunnel:
  mode: dtls
  # Address of the agent-side proxy's tunnel listener.
  dial_addr: "192.0.2.20:10162"
  psk_identity: "snmp-proxy-manager"
  # Accepts "hex:<hex>", "text:<string>", or a bare string (treated as text).
  psk: "text:change-me-shared-secret"
  # Optional DTLS 1.2 PSK ciphersuites, most preferred first; both sides
  # must share at least one. Supported: aes128-ccm-8 (default),
  # aes256-ccm-8, aes128-ccm, aes128-gcm, aes128-cbc.
  # psk_ciphersuites: ["aes256-ccm-8", "aes128-ccm-8"]
  server_name: "snmp-proxy-agent"
  # insecure_skip_verify is only for PSK mode (no CA); keep false in production.
  insecure_skip_verify: true
  keepalive_secs: 15
  max_reconnect_backoff: 5s
  max_frame_size: 8192

manager:
  # Clear SNMP leg: managers point their requests here.
  listen_addr: ":161"
  # Where relayed traps/informs are delivered (usually the real manager).
  trap_sink_addr: "127.0.0.1:10162"
  # Optional: also accept traps from local devices and relay them.
  trap_listen_addr: ":10163"

# Optional notification filtering at the relay ingress: notifications
# whose trap OID does not pass the filter are dropped before they are
# relayed. action: "allow" (forward only matching OIDs) or "deny" (drop
# matching OIDs); matching is prefix-based on arc boundaries.
# notifications:
#   filter:
#     action: deny
#     oids:
#       - "1.3.6.1.4.1.99"      # drop this enterprise's traps
#       - "1.3.6.1.6.3.1.1.5.2" # drop coldStart-ish standard traps
