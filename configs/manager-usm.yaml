# Manager-side proxy: USM translate mode. Managers speak plain v1/v2c on
# the clear leg; the proxy speaks SNMPv3 authPriv to the agent-side proxy
# over the secured tunnel.
role: manager

tunnel:
  mode: dtls
  # Address of the agent-side proxy's tunnel listener.
  dial_addr: "192.0.2.20:10162"
  psk_identity: "snmp-shield-manager"
  psk: "text:change-me-shared-secret"
  server_name: "snmp-shield-agent"
  insecure_skip_verify: true
  keepalive_secs: 15
  max_reconnect_backoff: 5s
  max_frame_size: 8192

security:
  mode: usm-translate
  # USM users shared with the agent side. The first user is used for
  # requests forwarded over the tunnel.
  users:
    - name: "proxy"
      auth_protocol: "sha"
      auth_passphrase: "change-me-auth"
      priv_protocol: "aes"
      priv_passphrase: "change-me-priv"
      # community used on the clear leg toward the real agent
      community: "public"
  # SNMPv3 engine ID of the REMOTE (agent-side) engine. Omit to discover
  # it automatically at startup.
  # engine_id: "hex:8000...0002"
  # Persistent engine boots/state (anti-rollback for our own engine).
  engine_store: "/var/lib/snmp-shield/engine-manager.json"
  # Community used in v2c notifications delivered to the trap sink.
  trap_community: "public"

manager:
  # Clear SNMP leg: managers point their requests here.
  listen_addr: ":161"
  # Where relayed traps/informs are delivered (usually the real manager).
  trap_sink_addr: "127.0.0.1:10162"
  # Optional: also accept traps from local devices and relay them.
  trap_listen_addr: ":10163"

# Optional SNMP metrics interface: a small read-only SNMPv2c health agent
# (GET/GETNEXT: identity, tunnel state, counters) and v2c event traps for
# tunnel lifecycle changes (up/down, HA failover). Lets an SNMP-native
# monitoring system watch the proxy without the Prometheus endpoint
# (--metrics-addr stays available alongside).
# metrics:
#   listen_addr: "127.0.0.1:10161"    # health MIB (GET/GETNEXT)
#   trap_sink_addr: "127.0.0.1:10164" # v2c event traps
#   community: "public"
#   # base_oid: ".1.3.6.1.4.1.58427.1" # enterprise OID (default)

# Optional front-leg access policy: client allow-list, per-client request
# rate limit, and write scoping. It governs the REQUEST leg only;
# notifications are governed by notifications.filter.
# Denials: off-list clients and over-rate clients are dropped in silence;
# a SET outside the write policy is answered with notWritable
# (v1: noSuchName) so the manager does not retransmit into a timeout.
# A SIGHUP reload re-reads ONLY this block in place (systemctl reload);
# every other block needs a restart. See README "Access control".
# access:
#   allow: ["10.8.0.0/24", "192.168.1.5"]   # IP or CIDR; empty = every client
#   rate_per_sec: 50                        # per client; 0 = unlimited
#   # Either the coarse switch (refuse every SET):
#   # read_only: true
#   # ...or an OID-scoped policy (deny overrides, allow must cover all):
#   write_policy:
#     default: deny
#     rules:
#       - {oid: "1.3.6.1.4.1.99.1",   action: allow}
#       - {oid: "1.3.6.1.4.1.99.1.9", action: deny}
